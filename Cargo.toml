[package]
name = "hot_corner"
version = "0.1.0"
edition = "2021"

[dependencies]
rdev = "0.5.3"
display-info = "0.5.1"
enigo = "0.3.0"

[profile.release]
strip = true
panic = "abort"
codegen-units = 1
opt-level = 3
lto = true

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]